# Where the built site is served (it replaces the hand-built page at /projects/sme-pulse).
# Change this one line to move it, for example to /projects/sme-pulse-evidence, then rebuild.
# SITE_DIR in refresh-workflow.draft.yml must match.
deployment:
  basePath: /projects/sme-pulse

# Light or dark follows the visitor's system. The slim site bar follows it the same way.
appearance:
  default: system
  switcher: false

theme:
  colorPalettes:
    default:
      light:
        - "#2a78d6"
        - "#eb6834"
        - "#2E7D7A"
        - "#5F6B7A"
        - "#45a1bf"
        - "#a5cdee"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
      dark:
        - "#3987e5"
        - "#d95926"
        - "#4FB3AE"
        - "#9AA5B4"
        - "#45a1bf"
        - "#a5cdee"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
  colorScales:
    default:
      light:
        - "#ADD8E6"
        - "#00008B"
      dark:
        - "#ADD8E6"
        - "#00008B"
  colors:
    primary:
      light: "#2a78d6"
      dark: "#3987e5"
    accent:
      light: "#c2410c"
      dark: "#fdba74"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    "@evidence-dev/csv": { }
    "@evidence-dev/duckdb": { }
