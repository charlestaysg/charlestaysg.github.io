# Monthly refresh of the SME Workforce Pulse page, Evidence version.
# Same data chain as the hand-built page: tools/sme-pulse/fetch.py pulls MOM data from
# data.gov.sg; if the data changed the new snapshot is kept, if not the old one is restored;
# either way the check date goes into data/last-checked.json. tools/sme-pulse/sctp_build.py
# then rebuilds the SCTP list from the Course Finder's published data. Then the Evidence project
# (tools/sme-pulse-evidence) turns that data into CSVs, checks them against the raw files
# and builds the static site. The built site replaces the live folder only after every
# earlier step has passed, so a failed fetch, check or build leaves the live page as it was.
# The monthly commit also keeps the repo active, so GitHub does not disable this schedule
# after 60 quiet days.
#
# Where the page lives: SITE_DIR below must match deployment.basePath in
# tools/sme-pulse-evidence/evidence.config.yaml (basePath is "/" + SITE_DIR).
name: Refresh SME Workforce Pulse

on:
  schedule:
    - cron: "0 1 2 * *"   # 09:00 SGT on the 2nd of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sme-pulse-refresh
  cancel-in-progress: false

env:
  SITE_DIR: projects/sme-pulse   # must match deployment.basePath in tools/sme-pulse-evidence/evidence.config.yaml

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/sme-pulse-evidence/package-lock.json

      # ---- 1. data: fetch, keep only if MOM data changed, record the check date
      - name: Keep previous snapshot
        working-directory: tools/sme-pulse
        run: cp data/snapshot.json "$RUNNER_TEMP/old-snapshot.json"

      - name: Fetch from data.gov.sg
        working-directory: tools/sme-pulse
        run: python fetch.py

      - name: Did the data change?
        id: diff
        working-directory: tools/sme-pulse
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          old = json.load(open(os.environ["RUNNER_TEMP"] + "/old-snapshot.json"))["datasets"]
          new = json.load(open("data/snapshot.json"))["datasets"]
          print("changed=" + ("true" if old != new else "false"))
          EOF

      - name: Keep the old snapshot if nothing changed
        if: steps.diff.outputs.changed != 'true'
        working-directory: tools/sme-pulse
        run: git checkout -- data/snapshot.json data/raw

      - name: Record check date
        working-directory: tools/sme-pulse
        run: |
          result=$([ "${{ steps.diff.outputs.changed }}" = "true" ] && echo updated || echo unchanged)
          printf '{"checked": "%s", "result": "%s"}\n' "$(TZ=Asia/Singapore date +%F)" "$result" > data/last-checked.json

      # ---- 2. the SCTP list, rebuilt from the Course Finder's published data (the file is committed
      # with tools/sme-pulse/data below; if the Course Finder data is missing or looks wrong the
      # script warns and keeps the old list), then the existing independent check on the raw files
      # and the old page's own build.
      - name: Build the SCTP list from Course Finder data
        working-directory: tools/sme-pulse
        run: python sctp_build.py

      # check.py reads index.html, so build the old page into a temporary file first.
      - name: Existing check (build.py + check.py, output discarded)
        working-directory: tools/sme-pulse
        run: |
          python build.py
          python check.py
          rm index.html

      # ---- 3. Evidence: CSVs, check the CSVs against the raw files, build the site
      - name: Install Evidence
        working-directory: tools/sme-pulse-evidence
        run: npm ci

      - name: Prepare CSVs and check them
        working-directory: tools/sme-pulse-evidence
        run: |
          npm run prep
          npm run check

      - name: Load sources and build (strict)
        working-directory: tools/sme-pulse-evidence
        run: |
          npx evidence sources
          npm run build:strict
          test -s build/index.html

      # ---- 4. only now touch the live folder
      - name: Replace the live page
        run: |
          rm -rf "$SITE_DIR"
          mkdir -p "$(dirname "$SITE_DIR")"
          cp -R tools/sme-pulse-evidence/build "$SITE_DIR"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tools/sme-pulse/data "$SITE_DIR"
          latest=$(python -c "import json;print(json.load(open('tools/sme-pulse/data/snapshot.json'))['datasets']['vacancies_total']['latest'])")
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            msg="SME Workforce Pulse: new MOM data (latest $latest)"
          else
            msg="SME Workforce Pulse: monthly check, no new MOM data (latest $latest)"
          fi
          git diff --cached --quiet && { echo "Nothing to commit (already checked today)."; exit 0; }
          git commit -m "$msg"
          git push
